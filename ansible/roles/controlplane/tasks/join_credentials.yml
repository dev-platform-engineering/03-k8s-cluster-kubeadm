---
- name: Controlplane | Upload control-plane certificates
  ansible.builtin.command:
    cmd: kubeadm init phase upload-certs --upload-certs
  delegate_to: "{{ kubeadm_bootstrap_host }}"
  run_once: true
  register: controlplane_upload_certs
  changed_when: false

- name: Controlplane | Extract certificate key
  ansible.builtin.set_fact:
    controlplane_certificate_key: >-
      {{
        controlplane_upload_certs.stdout_lines
        | select('match', '^[0-9a-f]{64}$')
        | list
        | first
      }}
  delegate_to: "{{ kubeadm_bootstrap_host }}"
  delegate_facts: true
  run_once: true

- name: Controlplane | Generate join command
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  delegate_to: "{{ kubeadm_bootstrap_host }}"
  run_once: true
  register: controlplane_join_command
  changed_when: false
