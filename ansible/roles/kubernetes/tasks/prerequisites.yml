- name: Kubernetes | Disable swap immediately
  ansible.builtin.command:
    cmd: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Kubernetes | Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^\s*([^#].*\s+swap\s+.*)$'
    replace: '# \1'

- name: Kubernetes | Install prerequisites
  ansible.builtin.package:
    name:
      - conntrack
      - socat
    state: present
